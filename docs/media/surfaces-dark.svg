<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-label="Use it anywhere. MCP over stdio for Claude Code, Codex, Cursor, Gemini CLI, VS Code and Hermes; an HTTP server with REST, an OpenAPI document and MCP; a Python package; the TypeScript library; the CLI. All of them call the same operations on your machine, learned once or pulled from the shared catalog, which reach websites such as Hacker News, YouTube, GitHub, Google Flights and Goodreads over plain HTTP. Calls never go through the catalog." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Use it anywhere. MCP over stdio for Claude Code, Codex, Cursor, Gemini CLI, VS Code and Hermes; an HTTP server with REST, an OpenAPI document and MCP; a Python package; the TypeScript library; the CLI. All of them call the same operations on your machine, learned once or pulled from the shared catalog, which reach websites such as Hacker News, YouTube, GitHub, Google Flights and Goodreads over plain HTTP. Calls never go through the catalog.</title><style>.march{stroke-dasharray:2 7;animation:march 1.4s linear infinite}@keyframes march{to{stroke-dashoffset:-9}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="1279" height="599" rx="16" fill="#161615" stroke="#2a2a28"/><defs><marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1L9,5L1,9z" fill="#85847e"/></marker><marker id="arrowApi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1L9,5L1,9z" fill="#3987e5"/></marker></defs><text x="40" y="76" font-size="13" fill="#85847e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.3">where you call it</text><text x="870" y="76" font-size="13" fill="#85847e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.3">websites, over plain HTTP</text><rect x="40" y="104" width="400" height="70" rx="12" fill="#1c1c1b" stroke="#2a2a28"/><text x="60" y="133" font-size="17" font-weight="700" fill="#ecebe6" letter-spacing="-0.2">MCP over stdio</text><text x="60" y="157" font-size="14" fill="#b9b8b0">Claude Code, Codex, Cursor, VS Code, Gemini CLI</text><path d="M440,139C485,139 480,311 516,311" fill="none" stroke="#3987e5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowApi)" class="march"/><rect x="40" y="190" width="400" height="70" rx="12" fill="#1c1c1b" stroke="#2a2a28"/><text x="60" y="219" font-size="17" font-weight="700" fill="#ecebe6" letter-spacing="-0.2">HTTP server</text><text x="60" y="243" font-size="13.5" fill="#6aa7f0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">api-anything serve: REST, /openapi.json, /mcp</text><path d="M440,225C485,225 480,311 516,311" fill="none" stroke="#3987e5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowApi)" class="march"/><rect x="40" y="276" width="400" height="70" rx="12" fill="#1c1c1b" stroke="#2a2a28"/><text x="60" y="305" font-size="17" font-weight="700" fill="#ecebe6" letter-spacing="-0.2">Python</text><text x="60" y="329" font-size="13.5" fill="#6aa7f0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">pip install api-anything</text><path d="M440,311C485,311 480,311 516,311" fill="none" stroke="#3987e5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowApi)" class="march"/><rect x="40" y="362" width="400" height="70" rx="12" fill="#1c1c1b" stroke="#2a2a28"/><text x="60" y="391" font-size="17" font-weight="700" fill="#ecebe6" letter-spacing="-0.2">TypeScript</text><text x="60" y="415" font-size="13.5" fill="#6aa7f0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">import { call } from &quot;api-anything&quot;</text><path d="M440,397C485,397 480,311 516,311" fill="none" stroke="#3987e5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowApi)" class="march"/><rect x="40" y="448" width="400" height="70" rx="12" fill="#1c1c1b" stroke="#2a2a28"/><text x="60" y="477" font-size="17" font-weight="700" fill="#ecebe6" letter-spacing="-0.2">CLI</text><text x="60" y="501" font-size="13.5" fill="#6aa7f0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">api-anything call &lt;site&gt; &lt;op&gt; key=value</text><path d="M440,483C485,483 480,311 516,311" fill="none" stroke="#3987e5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowApi)" class="march"/><rect x="870" y="113" width="370" height="52" rx="8" fill="#1f1f1d"/><text x="890" y="145" font-size="15" fill="#ecebe6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">news.ycombinator.com</text><path d="M764,311C800,311 820,139 864,139" fill="none" stroke="#3987e5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowApi)" class="march"/><rect x="870" y="199" width="370" height="52" rx="8" fill="#1f1f1d"/><text x="890" y="231" font-size="15" fill="#ecebe6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">youtube.com</text><path d="M764,311C800,311 820,225 864,225" fill="none" stroke="#3987e5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowApi)" class="march"/><rect x="870" y="285" width="370" height="52" rx="8" fill="#1f1f1d"/><text x="890" y="317" font-size="15" fill="#ecebe6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">github.com</text><path d="M764,311C800,311 820,311 864,311" fill="none" stroke="#3987e5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowApi)" class="march"/><rect x="870" y="371" width="370" height="52" rx="8" fill="#1f1f1d"/><text x="890" y="403" font-size="15" fill="#ecebe6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">google.com/travel/flights</text><path d="M764,311C800,311 820,397 864,397" fill="none" stroke="#3987e5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowApi)" class="march"/><rect x="870" y="457" width="370" height="52" rx="8" fill="#1f1f1d"/><text x="890" y="489" font-size="15" fill="#ecebe6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">goodreads.com</text><path d="M764,311C800,311 820,483 864,483" fill="none" stroke="#3987e5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowApi)" class="march"/><text x="870" y="540" font-size="14" fill="#b9b8b0">and more: 114 sites, 323 read operations bundled</text><rect x="520" y="191" width="240" height="240" rx="18" fill="#15253a" stroke="#3987e5" stroke-width="1.5"/><text x="640" y="249" font-size="24" font-weight="600" fill="#3987e5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">{ }</text><text x="640" y="285" font-size="21" font-weight="700" fill="#ecebe6" text-anchor="middle" letter-spacing="-0.3">api-anything</text><text x="640" y="313" font-size="14" fill="#b9b8b0" text-anchor="middle">on your machine</text><text x="640" y="351" font-size="13" fill="#b9b8b0" text-anchor="middle">learned or pulled once,</text><text x="640" y="371" font-size="13" fill="#b9b8b0" text-anchor="middle">called from everywhere</text><text x="640" y="399" font-size="13" fill="#b9b8b0" text-anchor="middle">sessions stay here,</text><text x="640" y="419" font-size="13" fill="#b9b8b0" text-anchor="middle">never in a spec</text><rect x="540" y="56" width="200" height="64" rx="12" fill="#1c1c1b" stroke="#2a2a28" stroke-dasharray="4 4"/><text x="640" y="84" font-size="15" font-weight="700" fill="#ecebe6" text-anchor="middle">shared catalog</text><text x="640" y="104" font-size="12.5" fill="#85847e" text-anchor="middle">specs and reports, no calls</text><path d="M640,124V185" stroke="#85847e" stroke-width="1.5" stroke-dasharray="3 5" marker-start="url(#arrowMuted)" marker-end="url(#arrowMuted)"/><text x="640" y="576" font-size="13.5" fill="#85847e" text-anchor="middle">Learn an operation once and every agent and program on the machine can call it. Calls run here, from your network, never through the catalog.</text></svg>